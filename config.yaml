settings:
  max_posts_per_feed: 10      # articles pulled per feed per run
  summary_word_limit: 120     # words stored per article summary
  card_excerpt_words: 40      # words actually rendered on cards (keep short —
                              # cards should tease, not republish)
  posts_per_page: 12          # cards per paginated page
  max_total_articles: 240     # hard cap on articles.json (oldest trimmed first);
                              # kept low so thin listing pages don't dominate
                              # the site's original editorial content
