site:
  name: "Medicare Monitor"
  tagline: "Tracking Medicare news, policy, and coverage changes."
  base_url: "https://www.MedicareMonitor.co"
  adsense_publisher_id: "ca-pub-4655632038473484"
  contact_email: "contact@medicaremonitor.co"
  footer_disclaimer: >-
    Medicare Monitor is an independent news aggregation service and is not
    affiliated with, endorsed by, or connected to the U.S. government, the
    Centers for Medicare & Medicaid Services (CMS), or the official Medicare
    program. For official information visit Medicare.gov.

# Static pages rendered with the site chrome and linked from the footer.
# Each entry needs: slug (URL path), title, description, file (body fragment).
pages:
  - slug: privacy
    title: "Privacy Policy"
    description: "How Medicare Monitor handles data, cookies, and advertising."
    file: pages/privacy.html

  - slug: about
    title: "About"
    description: "What Medicare Monitor is and how our curation works."
    file: pages/about.html

  - slug: contact
    title: "Contact"
    description: "How to reach the Medicare Monitor team."
    file: pages/contact.html

feeds:
  - category: "Medicare News"
    url: "https://kffhealthnews.org/feed/"

  - category: "Medicare News"
    url: "https://medcitynews.com/feed/"

  - category: "Healthcare Policy"
    url: "https://www.statnews.com/feed/"

  - category: "Healthcare Policy"
    url: "https://feeds.npr.org/1128/rss.xml"

  - category: "Senior Health"
    url: "https://www.medpagetoday.com/rss/headlines.xml"

  - category: "Senior Health"
    url: "https://www.healthcaredive.com/feeds/news/"

  - category: "Drug Coverage"
    url: "https://www.fiercehealthcare.com/rss/xml"

  - category: "Drug Coverage"
    url: "https://rss.politico.com/healthcare.xml"

  - category: "Industry News"
    url: "https://thehill.com/policy/healthcare/feed/"

settings:
  max_posts_per_feed: 10      # articles pulled per feed per run
  summary_word_limit: 120     # words shown in the card excerpt
  posts_per_page: 12          # cards per paginated page
  max_total_articles: 1000    # hard cap on articles.json (oldest trimmed first)
